name: Request HALFTIME VR Unity Personal Licence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation request for Unity 6000.0.60f1
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.60f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: HALFTIME-VR-Unity-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
