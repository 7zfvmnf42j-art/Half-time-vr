name: Deploy HALFTIME VR to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate installable PNG icons
        run: |
          npm install --no-save sharp
          mkdir -p icons
          node -e "const sharp=require('sharp'); Promise.all([sharp('icon.svg').resize(512,512).png().toFile('icons/icon-512.png'),sharp('icon.svg').resize(512,512).png().toFile('icons/icon-512-maskable.png')]).catch(e=>{console.error(e);process.exit(1)})"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
