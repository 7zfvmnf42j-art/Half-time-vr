name: Build HALFTIME VR Godot Quest APK

on:
  push:
    branches: [main]
    paths:
      - "GodotProject/**"
      - ".github/workflows/build-godot-quest-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: halftime-godot-quest-apk
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Configure Android export tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk unzip curl file
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate Android toolchain
        run: |
          godot --version
          java -version
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -f "$HOME/.android/debug.keystore"
          mkdir -p GodotProject/build

      - name: Import project and check scripts
        working-directory: GodotProject
        run: godot --headless --editor --path . --quit

      - name: Verify prebuilt Android APK templates
        working-directory: GodotProject
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          file "$TEMPLATE_DIR/android_debug.apk" "$TEMPLATE_DIR/android_release.apk"
          echo "Using Godot's prebuilt Android APK templates; no Gradle project generation required."
      - name: Export Android APK with explicit signing settings
        working-directory: GodotProject
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        shell: bash
        run: |
          set -o pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          godot --headless --verbose --path . --export-debug "Android" build/HALFTIME-VR-Quest.apk 2>&1 | tee ../android-export.log
          test -s build/HALFTIME-VR-Quest.apk
          file build/HALFTIME-VR-Quest.apk

      - name: Upload export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HALFTIME-VR-Android-Export-Diagnostics
          path: |
            android-export.log
            GodotProject/android-export.log
            android-template-install.log
            GodotProject/android-template-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Quest APK build
        uses: actions/upload-artifact@v4
        with:
          name: HALFTIME-VR-Godot-Quest-APK
          path: GodotProject/build/HALFTIME-VR-Quest.apk
          if-no-files-found: error
          retention-days: 14
